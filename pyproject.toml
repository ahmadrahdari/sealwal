[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sealwal"
version = "0.4.0"
description = "Post-quantum, private and erasable write provenance for cloud write-ahead logs"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ahmad Rahdari" }]
requires-python = ">=3.10"
dependencies = ["cryptography>=50"]

[project.optional-dependencies]
dev = ["pytest", "matplotlib"]

[tool.setuptools]
packages = ["sealwal"]
