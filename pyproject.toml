[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sealwal"
version = "0.1.0"
description = "Tamper-evident write-ahead log with post-quantum (ML-DSA) signed group commits"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ahmad Rahdari" }]
requires-python = ">=3.10"
dependencies = ["cryptography>=50"]

[project.optional-dependencies]
dev = ["pytest", "matplotlib"]

[tool.setuptools]
packages = ["sealwal"]
